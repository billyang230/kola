name: keepalive
# 每 2 天戳一下 Supabase，避免免費方案因 7 天沒活動被暫停
on:
  schedule:
    - cron: "17 3 */2 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_Oe1-HcjPVt4nNVm51ozslQ_LblbFN9b" \
            "https://kcjzxbkjrnggmwhxngzl.supabase.co/rest/v1/settings?select=key&limit=1")
          echo "HTTP $code"
          test "$code" = "200"
