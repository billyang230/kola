name: Deploy offline game to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '.nojekyll'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify static entry page exists
        run: |
          if [ ! -f index.html ]; then
            echo 'Missing index.html. Add the verified offline game entry page before deploying.'
            exit 1
          fi

      - name: Build 迷你測試服 (mini/)
        run: |
          mkdir -p mini
          python3 - <<'PY'
          import re
          s = open("index.html", encoding="utf-8").read()
          s = s.replace("<head>", '<head><base href="../"><script src="mini.js?v=1"></script>', 1)
          s = s.replace("可樂測試服", "迷你測試服")
          s = s.replace("https://billyang230.github.io/kola/\"", "https://billyang230.github.io/kola/mini/\"")
          open("mini/index.html", "w", encoding="utf-8").write(s)
          PY
          grep -c 'mini.js' mini/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Wait for Pages artifact registration
        run: sleep 15

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
